<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Góc Nhỏ Của Tôi</title>
    <link rel="icon" type="image/png" href="picture.jpg">
    <!-- Font chữ -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* GIỮ NGUYÊN CSS NHƯ CŨ (KHÔNG ĐỔI) */
        :root { --bg-color: #fdfbfb; --primary: #ff9a9e; --secondary: #fecfef; --text-dark: #4a4a4a; --card-bg: #ffffff; --danger: #ff6b6b; --success: #20bf6b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body { background-image: linear-gradient(120deg, var(--bg-color) 0%, #ebedee 100%); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; }
        .hidden { display: none !important; }
        .btn { padding: 10px 20px; border: none; border-radius: 20px; background: linear-gradient(to right, var(--primary), var(--secondary)); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 154, 158, 0.5); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); box-shadow: none; }
        .btn-danger { background: var(--danger); box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3); }
        #authScreen, #profileScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .auth-box { background: white; padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 90%; max-width: 400px; }
        .auth-box input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 15px; outline: none; transition: 0.3s; }
        .auth-box input:focus { border-color: var(--primary); }
        .avatar-preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 15px auto; border: 4px solid var(--secondary); background: #eee; cursor: pointer; }
        #appScreen { max-width: 800px; margin: 0 auto; padding: 20px; padding-bottom: 80px; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .streak-box { display: flex; align-items: center; gap: 5px; color: #ff9f43; font-weight: bold; }
        .post-area { background: white; padding: 20px; border-radius: 25px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        textarea { width: 100%; border: none; outline: none; resize: none; min-height: 100px; font-size: 16px; background: #f9f9f9; padding: 15px; border-radius: 15px; }
        .tools { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; flex-wrap: wrap; gap: 10px;}
        .tool-icons i { font-size: 22px; color: var(--primary); cursor: pointer; margin-right: 15px; transition: 0.2s; }
        .tool-icons i:hover { transform: scale(1.2); }
        .mood-selector { display: flex; gap: 10px; margin-top: 10px; }
        .mood { font-size: 25px; cursor: pointer; filter: grayscale(100%); transition: 0.3s; }
        .mood.active, .mood:hover { filter: grayscale(0%); transform: scale(1.2); }
        .image-preview-container { margin-top: 15px; position: relative; display: inline-block; }
        #postImgPreview { max-width: 100%; border-radius: 15px; display: none; }
        .remove-img { position: absolute; top: -10px; right: -10px; background: var(--danger); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; display: none;}
        .frame-selector { display: none; gap: 10px; margin-top: 10px; }
        .frame-btn { padding: 5px 10px; border: 1px solid #ccc; border-radius: 10px; cursor: pointer; background: white; font-size: 12px; }
        .frame-btn.active { border-color: var(--primary); background: var(--secondary); }
        .frame-none { border: none; }
        .frame-polaroid { padding: 10px 10px 40px 10px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 5px; }
        .frame-cute { border: 5px dashed var(--primary); border-radius: 20px; padding: 5px; }
        .feed { display: flex; flex-direction: column; gap: 20px; }
        .entry-card { padding: 20px; border-radius: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); position: relative; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .entry-header { display: flex; justify-content: space-between; margin-bottom: 15px; color: #777; font-size: 14px;}
        .entry-content { font-size: 16px; line-height: 1.6; white-space: pre-wrap; margin-bottom: 15px;}
        .entry-image { max-width: 100%; display: block; margin: 10px auto; }
        .entry-actions { text-align: right; }
        .entry-actions i { color: #ccc; cursor: pointer; transition: 0.3s; }
        .entry-actions i:hover { color: var(--danger); }
        #cameraContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        video { width: 100%; max-height: 80vh; object-fit: cover; }
        .camera-controls { position: absolute; bottom: 30px; display: flex; gap: 20px; align-items: center; }
        .capture-btn { width: 70px; height: 70px; border-radius: 50%; background: white; border: 5px solid #ccc; cursor: pointer; }
        .switch-cam-btn, .close-cam-btn { color: white; font-size: 30px; cursor: pointer; }
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .popup-overlay.show { opacity: 1; pointer-events: auto; }
        .popup-box { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 90%; max-width: 350px; transform: scale(0.8); transition: 0.3s; }
        .popup-overlay.show .popup-box { transform: scale(1); }
        .popup-icon { font-size: 50px; margin-bottom: 15px; }
        .popup-title { font-size: 20px; margin-bottom: 10px; font-weight: bold; }
        .popup-message { color: #666; margin-bottom: 20px; }
        .popup-buttons { display: flex; justify-content: center; gap: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .stat-item { background: #f9f9f9; padding: 15px; border-radius: 15px; text-align: center;}
        .stat-item span { display: block; font-size: 24px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

    <!-- HTML GIỮ NGUYÊN -->
    <div id="authScreen">
        <div class="auth-box">
            <h2>☁️ Tủ Kính Tâm Hồn ☁️</h2>
            <p style="margin-bottom: 20px; color: #777;">Chỉ riêng mình bạn biết</p>
            <input type="email" id="email" placeholder="Email của bạn">
            <input type="password" id="password" placeholder="Mật khẩu">
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <button class="btn" onclick="login()">Đăng Nhập</button>
                <button class="btn btn-outline" onclick="register()">Tạo Tài Khoản Mới</button>
            </div>
        </div>
    </div>

    <div id="profileScreen" class="hidden">
        <div class="auth-box">
            <h2>Bạn muốn được gọi là gì? 🥰</h2>
            <img id="avatarPreview" class="avatar-preview" src="https://via.placeholder.com/150" onclick="document.getElementById('avatarInput').click()">
            <input type="file" id="avatarInput" hidden accept="image/*" onchange="previewAvatar(event)">
            <p style="font-size: 12px; color: #888; margin-bottom: 10px;">(Chạm vào ảnh để đổi Avatar)</p>
            <input type="text" id="userName" placeholder="Biệt danh của bạn">
            <button class="btn" style="width: 100%; margin-top: 15px;" onclick="saveProfile()">Bắt đầu viết thôi</button>
        </div>
    </div>

    <div id="appScreen" class="hidden">
        <header>
            <div class="user-info">
                <img id="headerAvatar" src="" alt="Avatar">
                <div>
                    <h3 id="headerName">Tên User</h3>
                    <div class="streak-box"><i class="fas fa-fire"></i> Chuỗi: <span id="streakCount">0</span> ngày</div>
                </div>
            </div>
            <div style="display: flex; gap: 15px;">
                <i class="fas fa-chart-pie" style="font-size: 24px; color: var(--primary); cursor: pointer;" onclick="showStats()" title="Thống kê"></i>
                <i class="fas fa-sign-out-alt" style="font-size: 24px; color: #ccc; cursor: pointer;" onclick="confirmLogout()" title="Đăng xuất"></i>
            </div>
        </header>

        <div class="post-area">
            <textarea id="postContent" placeholder="Hôm nay của bạn thế nào? Hãy cứ viết ra hết nhé, đây là không gian của riêng bạn... Mọi cảm xúc đều xứng đáng được lắng nghe 💖"></textarea>
            
            <div class="mood-selector" id="moodList">
                <span class="mood active" data-mood="😊" onclick="selectMood(this)">😊</span>
                <span class="mood" data-mood="🥰" onclick="selectMood(this)">🥰</span>
                <span class="mood" data-mood="😂" onclick="selectMood(this)">😂</span>
                <span class="mood" data-mood="🥺" onclick="selectMood(this)">🥺</span>
                <span class="mood" data-mood="😡" onclick="selectMood(this)">😡</span>
                <span class="mood" data-mood="💔" onclick="selectMood(this)">💔</span>
            </div>

            <div class="image-preview-container">
                <img id="postImgPreview" src="" class="frame-none">
                <div class="remove-img" id="removeImgBtn" onclick="removeImage()"><i class="fas fa-times"></i></div>
            </div>

            <div class="frame-selector" id="frameSelector">
                <span style="font-size: 14px; font-weight: bold;">Chọn viền:</span>
                <button class="frame-btn active" data-frame="frame-none" onclick="selectFrame(this)">Không</button>
                <button class="frame-btn" data-frame="frame-polaroid" onclick="selectFrame(this)">Polaroid</button>
                <button class="frame-btn" data-frame="frame-cute" onclick="selectFrame(this)">Viền Cute</button>
            </div>

            <div class="tools">
                <div class="tool-icons">
                    <i class="fas fa-image" title="Tải ảnh lên" onclick="document.getElementById('postImageInput').click()"></i>
                    <i class="fas fa-camera" title="Chụp ảnh trực tiếp" onclick="openCamera()"></i>
                    <input type="file" id="postImageInput" hidden accept="image/*" onchange="previewPostImage(event)">
                </div>
                <button class="btn" onclick="savePost()">Lưu Nhật Ký</button>
            </div>
        </div>

        <div class="feed" id="diaryFeed"></div>
    </div>

    <div id="cameraContainer" class="hidden">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="canvasElement" class="hidden"></canvas>
        <div class="camera-controls">
            <i class="fas fa-times close-cam-btn" onclick="closeCamera()"></i>
            <div class="capture-btn" onclick="takeSnapshot()"></div>
            <i class="fas fa-sync-alt switch-cam-btn" onclick="switchCamera()"></i>
        </div>
    </div>

    <div class="popup-overlay" id="customPopup">
        <div class="popup-box">
            <div class="popup-icon" id="popupIcon">✨</div>
            <div class="popup-title" id="popupTitle">Thông báo</div>
            <div class="popup-message" id="popupMessage">Nội dung</div>
            <div class="popup-buttons" id="popupButtons"></div>
        </div>
    </div>

    <!-- Firebase SDKs (Bỏ phần Storage đi) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

       

  const firebaseConfig = {
            apiKey: "AIzaSyBlTU4B563sSsTVbLai_je29l6eC8T-cm0",
            authDomain: "snapenglish-cb6e2.firebaseapp.com",
            projectId: "snapenglish-cb6e2",
            storageBucket: "snapenglish-cb6e2.firebasestorage.app",
            messagingSenderId: "373152038413",
            appId: "1:373152038413:web:19284622571390f8585f44"
        };

        // ==========================================
        // 2. DÁN API KEY CỦA IMGBB VÀO ĐÂY (Để lưu ảnh miễn phí)
        // ==========================================
        const IMGBB_API_KEY = "f2a434e0f6597234a268d4a7d65a61c1";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Biến toàn cục
        let currentUser = null;
        let currentMood = '😊';
        let currentFrame = 'frame-none';
        let base64ImageToUpload = null;
        let allEntries = [];
        
        // Hàm upload ảnh lên ImgBB (Miễn phí)
        async function uploadImageToImgBB(base64Str) {
            try {
                // Tách phần đầu của base64 đi (chỉ lấy phần data phía sau dấu phẩy)
                const base64Data = base64Str.split(',')[1];
                const formData = new FormData();
                formData.append("image", base64Data);
                
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                if(data.success) {
                    return data.data.url; // Trả về link ảnh trực tiếp
                } else {
                    throw new Error("Lỗi upload ảnh: " + data.error.message);
                }
            } catch (error) {
                console.error(error);
                return null;
            }
        }

        window.showPopup = function(type, title, message, confirmCallback = null) {
            const popup = document.getElementById('customPopup');
            const icon = document.getElementById('popupIcon');
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = message;
            const btnContainer = document.getElementById('popupButtons');
            btnContainer.innerHTML = '';

            if (type === 'success') icon.innerText = '💖';
            else if (type === 'error') icon.innerText = '🥺';
            else if (type === 'warning') icon.innerText = '⚠️';
            else if (type === 'loading') icon.innerText = '⏳'; // Thêm icon loading

            if (confirmCallback) {
                btnContainer.innerHTML = `
                    <button class="btn btn-outline" onclick="closePopup()">Hủy</button>
                    <button class="btn btn-danger" id="confirmActionBtn">Đồng ý</button>
                `;
                document.getElementById('confirmActionBtn').onclick = () => { confirmCallback(); closePopup(); };
            } else {
                btnContainer.innerHTML = `<button class="btn" onclick="closePopup()">Đã hiểu</button>`;
            }
            popup.classList.add('show');
        }
        window.closePopup = () => document.getElementById('customPopup').classList.remove('show');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authScreen').classList.add('hidden');
                
                const profileRef = doc(db, "users", user.uid);
                const profileSnap = await getDoc(profileRef);
                
                if (!profileSnap.exists()) {
                    document.getElementById('profileScreen').classList.remove('hidden');
                } else {
                    document.getElementById('profileScreen').classList.add('hidden');
                    document.getElementById('appScreen').classList.remove('hidden');
                    loadUserProfile(profileSnap.data());
                    loadEntries();
                }
            } else {
                currentUser = null;
                document.getElementById('appScreen').classList.add('hidden');
                document.getElementById('profileScreen').classList.add('hidden');
                document.getElementById('authScreen').classList.remove('hidden');
            }
        });

        window.register = () => {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            if(!e || !p) return showPopup('warning', 'Ối!', 'Bạn điền thiếu email hoặc mật khẩu kìa.');
            createUserWithEmailAndPassword(auth, e, p).catch(err => showPopup('error', 'Lỗi rồi', err.message));
        }
        window.login = () => {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            if(!e || !p) return showPopup('warning', 'Ối!', 'Nhập email và mật khẩu để vào phòng nhé.');
            signInWithEmailAndPassword(auth, e, p).catch(err => showPopup('error', 'Sai thông tin', 'Email hoặc mật khẩu chưa đúng đâu bạn ơi.'));
        }
        window.confirmLogout = () => {
            showPopup('warning', 'Tạm biệt', 'Bạn muốn khóa tủ nhật ký và thoát ra?', () => signOut(auth));
        }

        let profileAvatarBase64 = null;
        window.previewAvatar = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                profileAvatarBase64 = e.target.result;
                document.getElementById('avatarPreview').src = profileAvatarBase64;
            };
            reader.readAsDataURL(file);
        }

        window.saveProfile = async () => {
            const name = document.getElementById('userName').value;
            if(!name) return showPopup('warning', 'Chưa có tên', 'Cho mình biết bạn tên gì nhé!');
            
            showPopup('loading', 'Đang thiết lập...', 'Đợi chút xíu để mình xây nhà cho bạn nha...');

            let avatarUrl = "https://via.placeholder.com/150";
            if (profileAvatarBase64) {
                // Đẩy ảnh avatar lên ImgBB
                const uploadedUrl = await uploadImageToImgBB(profileAvatarBase64);
                if(uploadedUrl) avatarUrl = uploadedUrl;
            }

            await setDoc(doc(db, "users", currentUser.uid), {
                name: name, avatar: avatarUrl, streak: 0, lastPostDate: null
            });
            
            closePopup();
            document.getElementById('profileScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadUserProfile({name, avatar: avatarUrl, streak: 0});
            loadEntries();
        }

        function loadUserProfile(data) {
            document.getElementById('headerName').innerText = data.name;
            document.getElementById('headerAvatar').src = data.avatar;
            document.getElementById('streakCount').innerText = data.streak || 0;
            
            if(!localStorage.getItem('askedReminder')) {
                setTimeout(() => {
                    showPopup('success', 'Bạn có muốn...', 'Thiết lập thói quen viết nhật ký mỗi ngày để duy trì chuỗi Locket lửa không?', () => {
                        showPopup('success', 'Tuyệt vời', 'Hãy cài báo thức trên điện thoại của bạn nhé! 💖');
                        localStorage.setItem('askedReminder', 'true');
                    });
                }, 3000);
            }
        }

        window.selectMood = (el) => {
            document.querySelectorAll('.mood').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
            currentMood = el.getAttribute('data-mood');
        }
        window.selectFrame = (el) => {
            document.querySelectorAll('.frame-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            currentFrame = el.getAttribute('data-frame');
            const previewImg = document.getElementById('postImgPreview');
            previewImg.className = currentFrame; 
        }

        window.previewPostImage = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                base64ImageToUpload = e.target.result;
                document.getElementById('postImgPreview').src = base64ImageToUpload;
                document.getElementById('postImgPreview').style.display = 'block';
                document.getElementById('removeImgBtn').style.display = 'flex';
                document.getElementById('frameSelector').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }
        window.removeImage = () => {
            base64ImageToUpload = null;
            document.getElementById('postImgPreview').src = '';
            document.getElementById('postImgPreview').style.display = 'none';
            document.getElementById('removeImgBtn').style.display = 'none';
            document.getElementById('frameSelector').style.display = 'none';
            document.getElementById('postImageInput').value = '';
        }

        const pastelColors = ['#fff5f5', '#f8f4ff', '#f0fbf0', '#fffcf0', '#f0f8ff'];

        window.savePost = async () => {
            const content = document.getElementById('postContent').value;
            if(!content.trim() && !base64ImageToUpload) return showPopup('warning', 'Chưa có gì', 'Bạn viết một chút gì đó hoặc up 1 bức ảnh nhé!');

            document.querySelector('.post-area .btn').innerText = 'Đang tải lên...';
            document.querySelector('.post-area .btn').disabled = true;

            let imageUrl = null;
            if(base64ImageToUpload) {
                // Đẩy ảnh nhật ký lên ImgBB
                imageUrl = await uploadImageToImgBB(base64ImageToUpload);
                if(!imageUrl) {
                    showPopup('error', 'Lỗi', 'Không thể tải ảnh lên, bạn thử lại nhé!');
                    document.querySelector('.post-area .btn').innerText = 'Lưu Nhật Ký';
                    document.querySelector('.post-area .btn').disabled = false;
                    return;
                }
            }

            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            
            const userRef = doc(db, "users", currentUser.uid);
            const userSnap = await getDoc(userRef);
            let currentStreak = userSnap.data().streak || 0;
            let lastPostDate = userSnap.data().lastPostDate;

            if (lastPostDate !== todayStr) {
                let yesterday = new Date(now);
                yesterday.setDate(now.getDate() - 1);
                const yesterdayStr = yesterday.toISOString().split('T')[0];

                if (lastPostDate === yesterdayStr) {
                    currentStreak += 1;
                } else {
                    currentStreak = 1;
                }
                await setDoc(userRef, { streak: currentStreak, lastPostDate: todayStr }, { merge: true });
                document.getElementById('streakCount').innerText = currentStreak;
            }

            const color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
            await addDoc(collection(db, `users/${currentUser.uid}/entries`), {
                content: content,
                mood: currentMood,
                imageUrl: imageUrl,
                imageFrame: currentFrame,
                bgColor: color,
                createdAt: serverTimestamp(),
                timestamp: Date.now()
            });

            document.getElementById('postContent').value = '';
            removeImage();
            document.querySelector('.post-area .btn').innerText = 'Lưu Nhật Ký';
            document.querySelector('.post-area .btn').disabled = false;
        }

        function loadEntries() {
            const q = query(collection(db, `users/${currentUser.uid}/entries`), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const feed = document.getElementById('diaryFeed');
                feed.innerHTML = '';
                allEntries = [];

                if(snapshot.empty) {
                    feed.innerHTML = '<div style="text-align:center; color:#999; padding: 20px;">Bạn chưa có trang nhật ký nào. Bắt đầu ngay hôm nay nhé! 🌱</div>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    allEntries.push(data);
                    const id = docSnap.id;
                    const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString('vi-VN') : 'Vừa xong...';
                    
                    let imgHTML = '';
                    if(data.imageUrl) {
                        imgHTML = `<img src="${data.imageUrl}" class="entry-image ${data.imageFrame}">`;
                    }

                    feed.innerHTML += `
                        <div class="entry-card" style="background: ${data.bgColor}">
                            <div class="entry-header">
                                <span><span style="font-size:20px">${data.mood}</span> • ${date}</span>
                                <div class="entry-actions">
                                    <i class="fas fa-trash-alt" onclick="confirmDelete('${id}')"></i>
                                </div>
                            </div>
                            <div class="entry-content">${data.content}</div>
                            ${imgHTML}
                        </div>
                    `;
                });
            });
        }

        window.confirmDelete = (id) => {
            showPopup('warning', 'Xóa ký ức?', 'Bạn có chắc chắn muốn xóa trang nhật ký này không?', async () => {
                await deleteDoc(doc(db, `users/${currentUser.uid}/entries`, id));
            });
        }

        let currentStream;
        let useFrontCamera = true;
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');

        window.openCamera = async () => {
            document.getElementById('cameraContainer').classList.remove('hidden');
            startCamera();
        }
        
        async function startCamera() {
            if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); }
            const constraints = { video: { facingMode: useFrontCamera ? "user" : "environment" } };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                closeCamera();
                showPopup('error', 'Lỗi Camera', 'Không thể truy cập camera.');
            }
        }

        window.switchCamera = () => { useFrontCamera = !useFrontCamera; startCamera(); }

        window.takeSnapshot = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            base64ImageToUpload = canvas.toDataURL('image/jpeg');
            
            document.getElementById('postImgPreview').src = base64ImageToUpload;
            document.getElementById('postImgPreview').style.display = 'block';
            document.getElementById('removeImgBtn').style.display = 'flex';
            document.getElementById('frameSelector').style.display = 'flex';
            
            closeCamera();
        }

        window.closeCamera = () => {
            if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); }
            document.getElementById('cameraContainer').classList.add('hidden');
        }

        window.showStats = () => {
            const now = new Date();
            let countWeek = 0, countMonth = 0, countYear = 0;

            allEntries.forEach(entry => {
                if(!entry.timestamp) return;
                const d = new Date(entry.timestamp);
                if (d.getFullYear() === now.getFullYear()) {
                    countYear++;
                    if (d.getMonth() === now.getMonth()) countMonth++;
                }
                const diffTime = Math.abs(now - d);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                if (diffDays <= 7) countWeek++;
            });

            const statsHTML = `
                <div class="stats-grid">
                    <div class="stat-item">Tuần này<span>${countWeek}</span></div>
                    <div class="stat-item">Tháng này<span>${countMonth}</span></div>
                    <div class="stat-item">Năm nay<span>${countYear}</span></div>
                </div>
                <div style="margin-top:15px; font-size:14px; color:#777;">Tổng cộng: <b>${allEntries.length}</b> trang. Cố gắng lên nhé! 🥰</div>
            `;
            
            const oldMessage = document.getElementById('popupMessage').innerHTML;
            document.getElementById('popupMessage').innerHTML = statsHTML;
            showPopup('success', 'Thống kê của bạn', '', () => {
                 setTimeout(() => document.getElementById('popupMessage').innerHTML = 'Nội dung', 500);
            });
            const btns = document.getElementById('popupButtons').querySelectorAll('button');
            if(btns.length > 1) btns[0].style.display = 'none';
        }
    </script>
</body>
</html>
